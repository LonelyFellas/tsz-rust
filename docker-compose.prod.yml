# Production Rust API stack.
#
# Start this stack from the Rust repository with:
#   ../tsz/deploy/ensure-docker-network.sh
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The API is published on the host loopback interface for local diagnostics and
# joins the shared edge network for the frontend nginx container. PostgreSQL and
# Redis remain on the backend-only network.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      PORT: "8383"
      BIND_IP: "0.0.0.0"
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8383:8383"
    networks:
      - backend
      - edge
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8383/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: tsz_rust
    volumes:
      - tsz_rust_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsz_rust"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

volumes:
  tsz_rust_pgdata:

networks:
  backend:
    name: tsz-rust-backend
    internal: true
  edge:
    name: tsz-prod-edge
    external: true
