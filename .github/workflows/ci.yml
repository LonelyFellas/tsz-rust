name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

# CI only needs to read repository contents.
permissions:
  contents: read

# A newer push makes an older run for the same branch or PR obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-audit' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  SQLX_OFFLINE: "true"

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  quality:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [dependency-audit]
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require dependency audit to pass
        env:
          AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
        run: test "$AUDIT_RESULT" = "success"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # 版本的唯一真相源是仓库根的 rust-toolchain.toml。这里读出来再传给 action，
      # 避免「两处各写一遍、只靠注释约束」——只改一处时 CI 会先装旧版本、再由 cargo
      # 触发 rustup 下载新版本，不报错，只是每次默默多花几分钟。
      - name: Resolve pinned Rust version
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "rust-toolchain.toml 里读不到 channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # 尾注是该 SHA 对应的上游 tag，不代表使用 stable 通道——版本来自上一步。
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # tag: stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Resolve CI cache fingerprint
        id: ci-fingerprint
        run: >-
          python3 ops/ci_fingerprint.py
          --profile dev-test --features all --sqlx-offline true
          --github-output "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ steps.ci-fingerprint.outputs.cache_key }}
          env-vars: CARGO SQLX_OFFLINE
          cache-bin: false
          cache-targets: false
          cache-on-failure: false
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' &&
                github.repository == 'LonelyFellas/tsz-rust' }}

      - name: Record Cargo cache result
        run: >-
          python3 ops/ci_metrics.py record --name cargo-cache-hit
          --value "${{ steps.cargo-cache.outputs.cache-hit || 'false' }}"
          --unit boolean

      - name: Fetch locked Cargo dependencies
        run: >-
          python3 ops/ci_metrics.py run --name cargo-fetch --
          python3 ops/ci_cargo_fetch.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check CI template helper formatting
        run: rustfmt --edition 2024 --check ops/ci_identity_template.rs

      - name: Test deployment manifest tooling
        run: python3 -m unittest ops/test_deployment_manifest.py

      - name: Test isolated backup restore drill safety
        run: python3 -m unittest discover -s ops -p 'test_backup_restore_drill.py'

      - name: Test local Git hooks
        run: python3 -m unittest ops/test_rule_doc_hook.py ops/test_pre_push_hook.py

      - name: Test CI module partitioning
        run: python3 -m unittest ops/test_ci_test_modules.py

      - name: Test integration shard execution audit
        run: python3 -m unittest ops/test_ci_test_shards.py

      - name: Test identity lifecycle timing safety
        run: python3 -m unittest ops/test_ci_identity_profile.py

      - name: Test CI workflow structure
        run: python3 -m unittest ops/test_ci_workflow.py

      - name: Test CI build fingerprints
        run: python3 -m unittest ops/test_ci_fingerprint.py

      - name: Test CI metrics
        run: python3 -m unittest ops/test_ci_metrics.py

      - name: Test Cargo fetch fallback
        run: python3 -m unittest ops/test_ci_cargo_fetch.py

      - name: Test release artifact manifests
        run: python3 -m unittest ops/test_release_artifact_manifest.py

      - name: Test isolated release and migration verification
        run: python3 -m unittest discover -s ops -p 'test_release_artifact_smoke.py'

      - name: Test migration compatibility evidence
        run: python3 -m unittest discover -s ops -p 'test_migration_compatibility.py'

      - name: Test read-only deployed baseline capture
        run: python3 -m unittest discover -s ops -p 'test_deployed_baseline.py'

      - name: Test deployment preflight
        run: python3 -m unittest ops/test_deployment_preflight.py

      - name: Test deploy skill artifact contract
        run: python3 -m unittest ops/test_deploy_skill.py ops/test_deployment_auth_smoke.py

      - name: Run Clippy
        run: >-
          python3 ops/ci_metrics.py run --name clippy --
          cargo clippy --locked --all-targets --all-features -- -D warnings

  unit-doc:
    if: github.event_name != 'schedule'
    name: Unit and doc tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tsz_rust
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsz_rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsz_rust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "rust-toolchain.toml 里读不到 channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # tag: stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Resolve CI cache fingerprint
        id: ci-fingerprint
        run: >-
          python3 ops/ci_fingerprint.py
          --profile test --features all --sqlx-offline true
          --github-output "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ steps.ci-fingerprint.outputs.cache_key }}
          env-vars: CARGO SQLX_OFFLINE
          cache-bin: false
          cache-targets: false
          cache-on-failure: false
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' &&
                github.repository == 'LonelyFellas/tsz-rust' }}

      - name: Record Cargo cache result
        run: >-
          python3 ops/ci_metrics.py record --name cargo-cache-hit
          --value "${{ steps.cargo-cache.outputs.cache-hit || 'false' }}"
          --unit boolean

      - name: Fetch locked Cargo dependencies
        run: >-
          python3 ops/ci_metrics.py run --name cargo-fetch --
          python3 ops/ci_cargo_fetch.py

      - name: Run unit and binary tests
        run: >-
          python3 ops/ci_metrics.py run --name lib-bins --
          cargo test --locked --all-features --lib --bins

      - name: Run doc tests
        run: >-
          python3 ops/ci_metrics.py run --name doc-tests --
          cargo test --locked --all-features --doc

  integration:
    if: github.event_name != 'schedule'
    name: Integration (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module: [lexicon-pagination, lexicon-handler, lexicon-other, admin, identity, platform]

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tsz_rust
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsz_rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsz_rust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "rust-toolchain.toml 里读不到 channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # tag: stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Resolve CI cache fingerprint
        id: ci-fingerprint
        run: >-
          python3 ops/ci_fingerprint.py
          --profile test-${{ startsWith(matrix.module, 'lexicon-') && 'lexicon' || matrix.module }} --features all --sqlx-offline true
          --github-output "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ steps.ci-fingerprint.outputs.cache_key }}
          env-vars: CARGO SQLX_OFFLINE
          cache-bin: false
          cache-targets: false
          cache-on-failure: false
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' &&
                github.repository == 'LonelyFellas/tsz-rust' }}

      - name: Record Cargo cache result
        run: >-
          python3 ops/ci_metrics.py record --name cargo-cache-hit
          --value "${{ steps.cargo-cache.outputs.cache-hit || 'false' }}"
          --unit boolean

      - name: Fetch locked Cargo dependencies
        run: >-
          python3 ops/ci_metrics.py run --name cargo-fetch --
          python3 ops/ci_cargo_fetch.py

      - name: Compile ${{ matrix.module }} integration tests
        run: >-
          python3 ops/ci_metrics.py run
          --name integration-compile-${{ matrix.module }} --
          python3 ops/ci_identity_profile.py build ${{ matrix.module }}

      - name: Run ${{ matrix.module }} integration tests
        run: >-
          python3 ops/ci_metrics.py run
          --name integration-${{ matrix.module }} --
          python3 ops/ci_identity_profile.py run ${{ matrix.module }}
          --report target/ci-shards/${{ matrix.module }}-report.json

      - name: Upload executed test inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-inventory-${{ matrix.module }}
          path: target/ci-shards/${{ matrix.module }}-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload identity phase measurements
        if: matrix.module == 'identity'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-phase-measurements
          path: target/ci-shards/identity-phases.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload lexicon handler phase measurements
        if: matrix.module == 'lexicon-handler'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lexicon-handler-phase-measurements
          path: target/ci-shards/lexicon-handler-phases.json
          if-no-files-found: error
          retention-days: 7

  lexicon-summary:
    # Preserve the existing required branch-protection check; every shard and
    # the executed-case audit must pass before this check can become green.
    name: Integration (lexicon)
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all integration shards to pass
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = "success"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download executed test inventories
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: integration-inventory-*
          path: integration-inventories

      - name: Require every discovered integration case exactly once
        run: python3 ops/ci_test_shards.py verify integration-inventories

  ci-summary:
    name: Format, lint and test
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [quality, unit-doc, integration, lexicon-summary, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_DOC_RESULT: ${{ needs['unit-doc'].result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INVENTORY_RESULT: ${{ needs['lexicon-summary'].result }}
          AUDIT_RESULT: ${{ needs['dependency-audit'].result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$UNIT_DOC_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$INVENTORY_RESULT" = "success"

  release-artifact:
    name: Build release artifact
    # 只在 main 推送与手动触发时跑。PR 不需要 release 产物，而它会给每个 PR 的 CI
    # 多加数分钟。代价是「只在 release profile 下才暴露的编译错误」要到合并后才发现；
    # clippy 已覆盖 --all-targets --all-features（debug profile），这类差异极少见，接受。
    # workflow_dispatch 只允许 main；PR 与特性分支不产生可部署 artifact。
    if: >-
      github.repository == 'LonelyFellas/tsz-rust' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # 生产服务器 tshb-test 是 Ubuntu 22.04（glibc 2.35），而 runner 是 24.04（glibc 2.39）。
    # glibc 只向后兼容：24.04 上编出的二进制在 22.04 上会因缺少 GLIBC_2.3x 符号直接无法启动。
    # 所以在与服务器同版本的容器里编译。**服务器升级发行版时这一行必须跟着改**，
    # 判据是容器的 glibc 不得高于服务器的 glibc。
    container: ubuntu:22.04

    steps:
      # 裸镜像需要 git、Python 与 C 工具链。连接超时无法拦住持续慢下载：
      # 每个源分别限制索引和下载总时长，保留已下载包再切源；不在 dpkg 安装中途超时。
      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          set -eu
          packages='ca-certificates curl git python3 build-essential pkg-config cmake'
          # ubuntu 的 docker-clean 钩子会删除默认 archives，切源期间使用独立下载目录。
          archives=$(mktemp -d)
          trap 'rm -rf "$archives"' EXIT
          mkdir -p "$archives/partial"
          chmod 755 "$archives"
          downloaded=false
          for mirror in \
            http://azure.archive.ubuntu.com/ubuntu/ \
            http://archive.ubuntu.com/ubuntu/ \
            http://security.ubuntu.com/ubuntu/
          do
            sed -i -E "s|https?://[^[:space:]]+/ubuntu/?|$mirror|g" /etc/apt/sources.list
            # 基础镜像改用其他源格式时直接失败，不能静默绕过镜像回退。
            grep -q "^deb .*${mirror}" /etc/apt/sources.list || exit 1
            if timeout --kill-after=5s 30s apt-get \
                -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
                -o APT::Update::Error-Mode=any update && \
              timeout --kill-after=5s 90s apt-get install -y --download-only --no-install-recommends \
                -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
                -o Dir::Cache::archives="$archives" $packages
            then
              downloaded=true
              break
            fi
            echo "::warning::Package download failed or timed out from $mirror; trying next mirror"
          done
          if [ "$downloaded" != true ]; then
            echo 'All package mirrors failed' >&2
            exit 1
          fi
          apt-get install -y --no-download --no-install-recommends \
            -o Dir::Cache::archives="$archives" $packages

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify exact main source
        id: source
        run: |
          # checkout 运行在宿主，后续命令运行在 job container；两边 uid 不同会触发
          # Git dubious ownership。该 job 仅 trusted main 运行，workspace 由 Actions 固定。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REPOSITORY" = "LonelyFellas/tsz-rust"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "git_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned Rust version
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$version" || { echo "rust-toolchain.toml 里读不到 channel"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 不装 rustfmt/clippy：本 job 只 build，多装的组件都是白下载。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # tag: stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Resolve CI cache fingerprint
        id: ci-fingerprint
        run: >-
          python3 ops/ci_fingerprint.py
          --profile release --features default --sqlx-offline true
          --output "$RUNNER_TEMP/release-fingerprint.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ steps.ci-fingerprint.outputs.cache_key }}
          env-vars: CARGO SQLX_OFFLINE
          cache-bin: false
          cache-targets: false
          cache-on-failure: false
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/main' &&
                github.repository == 'LonelyFellas/tsz-rust' }}

      - name: Record Cargo cache result
        run: >-
          python3 ops/ci_metrics.py record --name cargo-cache-hit
          --value "${{ steps.cargo-cache.outputs.cache-hit || 'false' }}"
          --unit boolean

      - name: Fetch locked Cargo dependencies
        run: >-
          python3 ops/ci_metrics.py run --name cargo-fetch --
          python3 ops/ci_cargo_fetch.py

      # 默认 feature：服务器不开 swagger，产物必须与它一致，不能用 --all-features。
      - name: Build release binary
        run: >-
          python3 ops/ci_metrics.py run --name release-build --
          cargo build --locked --release

      # 摘要打进 job 日志，作为「CI 见过的那个文件」的独立记录；
      # 部署时会重新计算并比对，制品从 CI 到服务器全程可追。
      - name: Record artifact digest
        # 用裸文件名生成：artifact 解包后文件在根目录，带 target/release/ 前缀会让
        # 部署侧的 `shasum -a 256 -c` 找不到文件。
        run: |
          (cd target/release && sha256sum tsz-rust | tee tsz-rust.sha256)
          python3 ops/release_artifact_manifest.py create \
            --artifact target/release/tsz-rust \
            --output target/release/tsz-rust.manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --git-ref "$GITHUB_REF" \
            --git-sha "$GITHUB_SHA" \
            --git-tree "${{ steps.source.outputs.git_tree }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --fingerprint "$RUNNER_TEMP/release-fingerprint.json"
          python3 ops/release_artifact_manifest.py verify \
            --manifest target/release/tsz-rust.manifest.json \
            --artifact target/release/tsz-rust \
            --expected-git-sha "$GITHUB_SHA" \
            --expected-git-tree "${{ steps.source.outputs.git_tree }}" \
            --expected-run-id "$GITHUB_RUN_ID"
          python3 ops/ci_metrics.py record --name artifact-size \
            --value "$(stat -c %s target/release/tsz-rust)" --unit bytes
          echo "--- 动态依赖（须只有 libc/libm/libgcc_s，且 GLIBC 版本不高于服务器）---"
          ldd target/release/tsz-rust
          objdump -T target/release/tsz-rust | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -uV | tail -1 \
            | xargs -I{} echo "所需最高 GLIBC 版本: {}"

      # artifact 以 zip 传输，可执行位不保证跨往返保留（实测当前组合会保留），
      # 因此部署侧仍会无条件 chmod +x 兜底。
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsz-rust-x86_64-linux-gnu-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            target/release/tsz-rust
            target/release/tsz-rust.sha256
            target/release/tsz-rust.manifest.json
          if-no-files-found: error
          retention-days: 30

  release-smoke:
    name: Verify release artifact
    permissions:
      contents: read
      actions: read
    needs: [release-artifact]
    if: >-
      github.repository == 'LonelyFellas/tsz-rust' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact main tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve exact artifact identity
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="tsz-rust-x86_64-linux-gnu-${GITHUB_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/release-artifacts.json"
          python3 - "$RUNNER_TEMP/release-artifacts.json" "$name" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          matches = [item for item in json.load(open(sys.argv[1]))['artifacts'] if item['name'] == sys.argv[2] and not item['expired']]
          assert len(matches) == 1, 'expected exactly one current-attempt release artifact'
          json.dump(matches[0], open(sys.argv[1] + '.selected', 'w'))
          print('id=' + str(matches[0]['id']))
          PY
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Download the uploaded release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ runner.temp }}/release-smoke-download
          merge-multiple: true

      - name: Prepare isolated dependency images
        run: |
          docker pull postgres:18-alpine
          docker pull redis:6.0-alpine
          docker pull python:3.12-alpine
          docker pull --platform linux/amd64 ubuntu:22.04

      - name: Verify downloaded binary with isolated PostgreSQL and Redis
        run: >-
          python3 ops/release_artifact_smoke.py
          --manifest "$RUNNER_TEMP/release-smoke-download/tsz-rust.manifest.json"
          --artifact "$RUNNER_TEMP/release-smoke-download/tsz-rust"
          --artifact-id '${{ steps.artifact.outputs.id }}'
          --artifact-metadata "$RUNNER_TEMP/release-artifacts.json.selected"
          --expected-sha "$GITHUB_SHA"
          --expected-tree '${{ steps.artifact.outputs.tree }}'
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/release-smoke-receipt.json"

      - name: Upload release verification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-smoke-receipt.json
          if-no-files-found: error
          retention-days: 30
