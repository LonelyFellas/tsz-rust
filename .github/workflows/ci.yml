name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI only needs to read repository contents.
permissions:
  contents: read

# A newer push makes an older run for the same branch or PR obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  SQLX_OFFLINE: "true"

jobs:
  ci:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tsz_rust
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsz_rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsz_rust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # 尾注是该 SHA 对应的上游 tag，不代表使用 stable 通道——版本由下面的 toolchain 写死。
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # tag: stable
        with:
          # 必须与仓库根的 rust-toolchain.toml 保持一致；写死版本而不是 `stable`，
          # 否则 stable 每次滚动都可能让既有代码在 CI 上突然红（2026-08-21 已发生一次）。
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test deployment manifest tooling
        run: python3 -m unittest ops/test_deployment_manifest.py

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features
