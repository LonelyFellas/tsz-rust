[package]
name = "tsz-rust"
version = "0.1.0"
edition = "2024"
# 裸 `cargo run` 起服务器；seed 等一次性命令用 `cargo run --bin <name>` 显式指定
default-run = "tsz-rust"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
bcrypt = "0.19.2"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-redis = "0.23.0"
# 直接依赖 redis 只为打开 `script` feature（deadpool-redis 默认不开）——EVALSHA/Script 需要它。
# 版本跟随 deadpool-redis 拉的 redis 1.x，Cargo 会 feature-union 到同一个实例，不会双份。
redis = { version = "1", default-features = false, features = ["script"] }
dotenvy = "0.15.7"
envy = "0.4.2"
flate2 = "1.1.9"
futures-util = "0.3.33"
getrandom = "0.4.3"
http = "1.4.0"
jsonwebtoken = { version = "10.4.0", default-features = false, features = [
    "rust_crypto",
] }
opendal = { version = "0.58.1", default-features = false, features = [
    "executors-tokio",
    # OpenDAL 0.58's `install_default()` is gated on this facade feature. Enabling only the
    # rustls subfeature compiles the transport crate but leaves the process default uninstalled.
    "http-transport-reqwest",
    "services-oss",
] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
reqsign-aliyun-oss = "3.1.4"
reqsign-core = "3.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
hmac = "0.13.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "migrate",
    "chrono",
], default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
# OpenAPI 文档。utoipa 出 spec（轻量，常在，所有 #[derive(ToSchema)] / #[utoipa::path] 都依赖它）。
# uuid feature 让 ToSchema 认识 Uuid（映射成 string）。
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
# Swagger UI 页面。用 rust-embed 把静态资源打进二进制（几 MB），故设为 optional，
# 由 `swagger` feature 控制——只在 dev/staging 开，release 默认不带（安全 + 省体积）。
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.24"
uuid = { version = "1.23.4", features = ["v7", "serde"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.53"
regex = "1.13.1"
tower-http = { version = "0.7.0", features = ["trace"] }

[features]
# 开启后在 /swagger-ui 暴露可交互 API 文档。默认关闭：release 二进制不含 UI 资源、不暴露接口清单。
# 开发预览：cargo run --features swagger
swagger = ["dep:utoipa-swagger-ui"]

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
