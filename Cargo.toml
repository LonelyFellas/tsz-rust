[package]
name = "tsz-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
bcrypt = "0.19.2"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-redis = "0.23.0"
# 直接依赖 redis 只为打开 `script` feature（deadpool-redis 默认不开）——EVALSHA/Script 需要它。
# 版本跟随 deadpool-redis 拉的 redis 1.x，Cargo 会 feature-union 到同一个实例，不会双份。
redis = { version = "1", default-features = false, features = ["script"] }
dotenvy = "0.15.7"
envy = "0.4.2"
getrandom = "0.4.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "migrate",
    "chrono",
], default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-general-category = "1.1.0"
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
