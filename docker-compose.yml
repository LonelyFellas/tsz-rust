services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsz_rust
    ports:
      - "5433:5432" # 避开 tsz-go 的 5432
    volumes:
      - tsz_rust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # 对齐 .env 的 REDIS_URL；tsz-go 暂无 redis，不冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # OTP/缓存数据到期即弃，无需持久化卷——容器重建即清空，符合语义

volumes:
  tsz_rust_pgdata:
